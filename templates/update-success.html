{{if .Success}}
<div class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded mb-4">
    <div class="flex items-center">
        <svg class="h-4 w-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
        </svg>
        <span class="font-medium">Link updated successfully!</span>
    </div>
    {{if ne .UpdateResult.OldShortCode .UpdateResult.NewShortCode}}
    <p class="mt-2 text-sm">
        New short URL: <a href="{{.UpdateResult.ShortURL}}" target="_blank" class="font-mono text-blue-600 hover:underline">{{.UpdateResult.ShortURL}}</a>
    </p>
    {{else}}
    <p class="mt-2 text-sm">
        Short URL: <a href="{{.UpdateResult.ShortURL}}" target="_blank" class="font-mono text-blue-600 hover:underline">{{.UpdateResult.ShortURL}}</a>
    </p>
    {{end}}
</div>
{{else}}
<div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">
    <div class="flex items-center">
        <svg class="h-4 w-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
        <span class="font-medium">Error updating link:</span>
    </div>
    <p class="mt-1 text-sm">{{.Error}}</p>
</div>
{{end}}
